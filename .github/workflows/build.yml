name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Listar includes do projeto
        run: |
          grep -rn "#include" src/
