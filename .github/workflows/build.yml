name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Compilar oscetool e verificar compilador PPU
        run: |
          which ppu-gcc || find /usr/local/ps3dev -name "*gcc*"
          git clone --depth 1 https://github.com /tmp/ps3sce
          make -C /tmp/ps3sce
          ls -la data/ release/ src/
