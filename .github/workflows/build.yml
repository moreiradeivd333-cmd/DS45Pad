name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Verificar ferramentas internas e pasta data
        run: |
          ls -la /usr/local/ps3dev/bin/
          ls -la /usr/local/ps3dev/ppu/bin/
          ls -la data/ release/ src/
