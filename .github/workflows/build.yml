name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Compilar e Assinar SPRX
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          mkdir -p /tmp/inc/cell /tmp/inc/sys

          printf '#include <stdint.h>\n#define CELL_PAD_OK 0\n#define CELL_PAD_MAX_PORT_NUM 7\n#define CELL_PAD_MAX_CODES 64\n#define CELL_PAD_STATUS_DISCONNECTED 0\n#define CELL_PAD_STATUS_CONNECTED 1\n#define CELL_PAD_ERROR_UNINITIALIZED 0x80121104\n#define CELL_PAD_ERROR_NO_DEVICE 0x80121107\n#define CELL_PAD_CAPABILITY_PS3_CONFORMITY 1\n#define CELL_PAD_CAPABILITY_PRESS_MODE 2\n#define CELL_PAD_CAPABILITY_SENSOR_MODE 4\n#define CELL_PAD_CAPABILITY_HP_ANALOG_STICK 8\n#define CELL_PAD_CAPABILITY_ACTUATOR 16\ntypedef struct { int32_t len; uint16_t button; } CellPadData;\ntypedef struct { uint32_t max_connect, now_connect, system_info, port_status, port_setting, device_capability, device_type; } CellPadInfo2;\ntypedef struct { uint8_t motor, reserved; } CellPadActParam;\nint32_t cellPadGetData(uint32_t, CellPadData*);\nint32_t cellPadGetDataExtra(uint32_t, uint32_t*, CellPadData*);\nint32_t cellPadGetInfo2(CellPadInfo2*);\nint32_t cellPadSetActDirect(uint32_t, CellPadActParam*);\nint32_t cellPadSetPortSetting(uint32_t, uint32_t);\n' > /tmp/inc/cell/pad.h

          printf '#include <stdint.h>\n#define CELL_FS_O_RDONLY 0\n#define CELL_FS_O_WRONLY 1\n#define CELL_FS_O_RDWR 2\n#define CELL_FS_O_CREAT 0100\n#define CELL_FS_O_TRUNC 01000\n#define CELL_FS_O_APPEND 02000\n#define CELL_FS_SUCCEEDED 0\nint cellFsOpen(const char*, int, int*, const void*, uint64_t);\nint cellFsRead(int, void*, uint64_t, uint64_t*);\nint cellFsWrite(int, const void*, uint64_t, uint64_t*);\nint cellFsClose(int);\n' > /tmp/inc/cell/cell_fs.h

          printf '#include <stdint.h>\n#define CELL_USBD_PROBE_SUCCEEDED 0\n#define CELL_USBD_PROBE_FAILED -1\n#define CELL_USBD_ATTACH_SUCCEEDED 0\n#define CELL_USBD_ATTACH_FAILED -1\n#define CELL_USBD_DETACH_SUCCEEDED 0\n#define CELL_USBD_DETACH_FAILED -1\n#define USB_DESCRIPTOR_TYPE_DEVICE 1\n#define USB_DESCRIPTOR_TYPE_CONFIGURATION 2\n#define USB_DESCRIPTOR_TYPE_INTERFACE 4\n#define USB_DESCRIPTOR_TYPE_ENDPOINT 5\n#define USB_DESCRIPTOR_TYPE_HID 0x21\n#define USB_DESCRIPTOR_TYPE_REPORT 0x22\ntypedef struct { uint8_t bLength, bDescriptorType; uint16_t bcdUSB; uint8_t bDeviceClass, bDeviceSubClass, bDeviceProtocol, bMaxPacketSize0; uint16_t idVendor, idProduct, bcdDevice; uint8_t iManufacturer, iProduct, iSerialNumber, bNumConfigurations; } UsbDeviceDescriptor;\ntypedef UsbDeviceDescriptor CellUsbdDeviceDescriptor;\ntypedef struct { uint8_t bLength, bDescriptorType; uint16_t wTotalLength; uint8_t bNumInterfaces, bConfigurationValue, iConfiguration, bmAttributes, MaxPower; } UsbConfigurationDescriptor;\ntypedef struct { uint8_t bLength, bDescriptorType, bInterfaceNumber, bAlternateSetting, bNumEndpoints, bInterfaceClass, bInterfaceSubClass, bInterfaceProtocol, iInterface; } UsbInterfaceDescriptor;\ntypedef struct { uint8_t bLength, bDescriptorType, bEndpointAddress, bmAttributes; uint16_t wMaxPacketSize; uint8_t bInterval; } UsbEndpointDescriptor;\ntypedef UsbEndpointDescriptor CellUsbdEndpointDescriptor;\ntypedef struct { const char *name; int (*probe)(int); int (*attach)(int); int (*detach)(int); } CellUsbdLddOps;\ntypedef void (*CellUsbdDoneCallback)(int32_t, int32_t, void*);\nint32_t cellUsbdInit(void);\nint32_t cellUsbdEnd(void);\nint32_t cellUsbdRegisterLdd(CellUsbdLddOps*);\nint32_t cellUsbdUnregisterLdd(CellUsbdLddOps*);\nvoid *cellUsbdScanStaticDescriptor(int32_t, void*, uint8_t);\nint32_t cellUsbdOpenPipe(int32_t, void*);\nint32_t cellUsbdClosePipe(int32_t);\nint32_t cellUsbdControlTransfer(int32_t, void*, void*, CellUsbdDoneCallback, void*);\nint32_t cellUsbdInterruptTransfer(int32_t, void*, uint32_t, CellUsbdDoneCallback, void*);\n' > /tmp/inc/cell/usbd.h

          printf '#include <stdint.h>\ntypedef uint64_t sys_ppu_thread_t;\n#define SYS_PPU_THREAD_CREATE_JOINABLE 1\nint sys_ppu_thread_create(sys_ppu_thread_t*, void (*)(uint64_t), uint64_t, int, uint64_t, uint64_t, const char*);\nvoid sys_ppu_thread_exit(uint64_t);\nint sys_ppu_thread_join(sys_ppu_thread_t, uint64_t*);\n' > /tmp/inc/sys/ppu_thread.h
          printf '#include <stdint.h>\nint sys_timer_usleep(uint64_t);\nint sys_timer_sleep(unsigned int);\n' > /tmp/inc/sys/timer.h
          printf '#include <stdint.h>\n#define SYS_PROCESS_PRIMARY_STACK_SIZE_64K 0x10000\n#define SYS_PROCESS_PARAM(p, s)\ntypedef int32_t sys_pid_t;\nsys_pid_t sys_process_getpid(void);\n' > /tmp/inc/sys/process.h
          printf '#include <stdint.h>\ntypedef int32_t sys_prx_id_t;\n#define SYS_PRX_RESIDENT 0\n#define SYS_PRX_NO_RESIDENT 1\n#define SYS_PRX_START_OK 0\n#define SYS_PRX_STOP_OK 0\n#define SYS_MODULE_INFO(n, a, mj, mn)\n#define SYS_MODULE_START(f)\n#define SYS_MODULE_STOP(f)\n#define SYS_LIB_DECLARE_WITH_STUB(l, a, s)\n#define SYS_LIB_EXPORT(f, l)\n' > /tmp/inc/sys/prx.h
          printf '#include <stdint.h>\ntypedef uint32_t sys_mutex_t;\ntypedef struct { uint32_t attr_protocol, attr_recursive, attr_pshared, attr_adaptive; uint64_t key; int32_t flags; uint32_t pad; char name; } sys_mutex_attribute_t;\ntypedef struct { uint64_t lock_var; uint32_t attribute, recursive_count, sleep_queue, pad; } sys_lwmutex_t;\ntypedef struct { uint32_t attr_protocol, attr_recursive; char name; } sys_lwmutex_attribute_t;\n#define SYS_SYNC_PRIORITY 1\n#define SYS_SYNC_NOT_RECURSIVE 0x20\n#define SYS_SYNC_RECURSIVE 0x10\n#define sys_mutex_attribute_initialize(a) do { (a).attr_protocol=1; (a).attr_recursive=0x20; } while(0)\n#define sys_lwmutex_attribute_initialize(a) do { (a).attr_protocol=1; (a).attr_recursive=0x20; } while(0)\nint sys_mutex_create(sys_mutex_t*, const sys_mutex_attribute_t*);\nint sys_mutex_destroy(sys_mutex_t*);\nint sys_mutex_lock(sys_mutex_t, uint64_t);\nint sys_mutex_unlock(sys_mutex_t);\nint sys_lwmutex_create(sys_lwmutex_t*, const sys_lwmutex_attribute_t*);\nint sys_lwmutex_destroy(sys_lwmutex_t*);\nint sys_lwmutex_lock(sys_lwmutex_t*, uint64_t);\nint sys_lwmutex_unlock(sys_lwmutex_t*);\n' > /tmp/inc/sys/synchronization.h

          cd src
          powerpc64-ps3-elf-gcc -O2 -m32 -ffunction-sections -fdata-sections -nostartfiles -nodefaultlibs -std=gnu99 -I. -I/tmp/inc -I$PS3DEV/ppu/include -L$PS3DEV/ppu/lib -Wl,--gc-sections -Wl,--unresolved-symbols=ignore-all -o ds45pad_vsh.elf libc.c util.c hook.c config.c ds4.c dualsense.c gamehook.c usb.c passthru.c diag.c main.c
          sprxlinker ds45pad_vsh.elf || true
          make_self ds45pad_vsh.elf ds45pad_vsh.sprx || fself ds45pad_vsh.elf ds45pad_vsh.sprx || true
          ls -la

      - name: Enviar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: DS45Pad-SixaxisMod
          path: |
            src/ds45pad_vsh.elf
            src/ds45pad_vsh.sprx
          if-no-files-found: warn
