name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias 32-bit e ferramentas
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip p7zip-full libc6:i386 libstdc++6:i386 zlib1g:i386 libssl-dev libgmp-dev

      - name: Baixar CELL_SDK e scetool
        run: |
          mkdir -p /tmp/sdk
          git clone --depth 1 https://github.com /tmp/sdk/ps3sdk || true
          ls -la /tmp/sdk/ps3sdk/ || true

      - name: Verificar estrutura do SDK
        run: |
          find /tmp/sdk -maxdepth 3
