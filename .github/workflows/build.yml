name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Criar headers Cell SDK, compilar e assinar SPRX
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          mkdir -p /tmp/cell_inc/cell /tmp/cell_inc/sys

          cat << 'EOF' > /tmp/cell_inc/cell/pad.h
          #ifndef _CELL_PAD_H_
          #define _CELL_PAD_H_
          #include <stdint.h>
          #define CELL_PAD_OK 0
          #define CELL_PAD_MAX_PORT_NUM 7
          #define CELL_PAD_MAX_CODES 64
          #define CELL_PAD_STATUS_DISCONNECTED 0
          #define CELL_PAD_STATUS_CONNECTED 1
          #define CELL_PAD_ERROR_UNINITIALIZED 0x80121104
          #define CELL_PAD_ERROR_NO_DEVICE 0x80121107
          #define CELL_PAD_CAPABILITY_PS3_CONFORMITY (1 << 0)
          #define CELL_PAD_CAPABILITY_PRESS_MODE (1 << 1)
          #define CELL_PAD_CAPABILITY_SENSOR_MODE (1 << 2)
          #define CELL_PAD_CAPABILITY_HP_ANALOG_STICK (1 << 3)
          #define CELL_PAD_CAPABILITY_ACTUATOR (1 << 4)
          typedef struct CellPadData { int32_t len; uint16_t button[CELL_PAD_MAX_CODES]; } CellPadData;
          typedef struct CellPadInfo2 {
            uint32_t max_connect; uint32_t now_connect; uint32_t system_info;
            uint32_t port_status[CELL_PAD_MAX_PORT_NUM];
            uint32_t port_setting[CELL_PAD_MAX_PORT_NUM];
            uint32_t device_capability[CELL_PAD_MAX_PORT_NUM];
            uint32_t device_type[CELL_PAD_MAX_PORT_NUM];
          } CellPadInfo2;
          typedef struct CellPadActParam { uint8_t motor; uint8_t reserved; } CellPadActParam;
          int32_t cellPadGetData(uint32_t port_no, CellPadData *data);
          int32_t cellPadGetDataExtra(uint32_t port_no, uint32_t *device_type, CellPadData *data);
          int32_t cellPadGetInfo2(CellPadInfo2 *info);
          int32_t cellPadSetActDirect(uint32_t port_no, CellPadActParam *param);
          int32_t cellPadSetPortSetting(uint32_t port_no, uint32_t port_setting);
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/cell/cell_fs.h
          #ifndef _CELL_FS_H_
          #define _CELL_FS_H_
          #include <stdint.h>
          #define CELL_FS_O_RDONLY 000000
          #define CELL_FS_O_WRONLY 000001
          #define CELL_FS_O_RDWR   000002
          #define CELL_FS_O_CREAT  000100
          #define CELL_FS_O_TRUNC  001000
          #define CELL_FS_O_APPEND 002000
          #define CELL_FS_SUCCEEDED 0
          int cellFsOpen(const char *path, int flags, int *fd, const void *arg, uint64_t size);
          int cellFsRead(int fd, void *buf, uint64_t nbytes, uint64_t *nread);
          int cellFsWrite(int fd, const void *buf, uint64_t nbytes, uint64_t *nwrite);
          int cellFsClose(int fd);
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/cell/usbd.h
          #ifndef _CELL_USBD_H_
          #define _CELL_USBD_H_
          #include <stdint.h>
          #define CELL_USBD_PROBE_SUCCEEDED 0
          #define CELL_USBD_PROBE_FAILED -1
          #define CELL_USBD_ATTACH_SUCCEEDED 0
          #define CELL_USBD_ATTACH_FAILED -1
          #define CELL_USBD_DETACH_SUCCEEDED 0
          #define CELL_USBD_DETACH_FAILED -1
          typedef struct CellUsbdDeviceDescriptor {
            uint8_t bLength; uint8_t bDescriptorType; uint16_t bcdUSB;
            uint8_t bDeviceClass; uint8_t bDeviceSubClass; uint8_t bDeviceProtocol;
            uint8_t bMaxPacketSize0; uint16_t idVendor; uint16_t idProduct;
            uint16_t bcdDevice; uint8_t iManufacturer; uint8_t iProduct;
            uint8_t iSerialNumber; uint8_t bNumConfigurations;
          } CellUsbdDeviceDescriptor;
          typedef CellUsbdDeviceDescriptor UsbDeviceDescriptor;
          typedef struct CellUsbdEndpointDescriptor {
            uint8_t bLength; uint8_t bDescriptorType; uint8_t bEndpointAddress;
            uint8_t bmAttributes; uint16_t wMaxPacketSize; uint8_t bInterval;
          } CellUsbdEndpointDescriptor;
          typedef CellUsbdEndpointDescriptor UsbEndpointDescriptor;
          typedef struct CellUsbdLddOps {
            const char *name;
            int (*probe)(int dev_id);
            int (*attach)(int dev_id);
            int (*detach)(int dev_id);
          } CellUsbdLddOps;
          typedef void (*CellUsbdDoneCallback)(int32_t result, int32_t count, void *arg);
          int32_t cellUsbdInit(void);
          int32_t cellUsbdEnd(void);
          int32_t cellUsbdRegisterLdd(CellUsbdLddOps *lddops);
          int32_t cellUsbdUnregisterLdd(CellUsbdLddOps *lddops);
          void *cellUsbdScanStaticDescriptor(int32_t dev_id, void *ptr, uint8_t type);
          int32_t cellUsbdOpenPipe(int32_t dev_id, void *desc);
          int32_t cellUsbdClosePipe(int32_t pipe_id);
          int32_t cellUsbdControlTransfer(int32_t pipe_id, void *req, void *buf, CellUsbdDoneCallback cb, void *arg);
          int32_t cellUsbdInterruptTransfer(int32_t pipe_id, void *buf, uint32_t len, CellUsbdDoneCallback cb, void *arg);
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/sys/ppu_thread.h
          #ifndef _SYS_PPU_THREAD_H_
          #define _SYS_PPU_THREAD_H_
          #include <stdint.h>
          typedef uint64_t sys_ppu_thread_t;
          #define SYS_PPU_THREAD_CREATE_JOINABLE 0x00000001
          int sys_ppu_thread_create(sys_ppu_thread_t *thread_id, void (*entry)(uint64_t), uint64_t arg, int prio, uint64_t stacksize, uint64_t flags, const char *threadname);
          void sys_ppu_thread_exit(uint64_t val);
          int sys_ppu_thread_join(sys_ppu_thread_t thread_id, uint64_t *vptr);
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/sys/timer.h
          #ifndef _SYS_TIMER_H_
          #define _SYS_TIMER_H_
          #include <stdint.h>
          int sys_timer_usleep(uint64_t useconds);
          int sys_timer_sleep(unsigned int seconds);
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/sys/process.h
          #ifndef _SYS_PROCESS_H_
          #define _SYS_PROCESS_H_
          #include <stdint.h>
          #define SYS_PROCESS_PRIMARY_STACK_SIZE_64K 0x10000
          #define SYS_PROCESS_PARAM(prio, stacksize)
          typedef int32_t sys_pid_t;
          sys_pid_t sys_process_getpid(void);
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/sys/prx.h
          #ifndef _SYS_PRX_H_
          #define _SYS_PRX_H_
          #include <stdint.h>
          typedef int32_t sys_prx_id_t;
          #define SYS_PRX_RESIDENT 0
          #define SYS_PRX_NO_RESIDENT 1
          #define SYS_MODULE_INFO(name, attr, major, minor)
          #define SYS_MODULE_START(func)
          #define SYS_MODULE_STOP(func)
          #define SYS_LIB_DECLARE_WITH_STUB(libname, attr, stubname)
          #define SYS_LIB_EXPORT(func, libname)
          #endif
          EOF

          cat << 'EOF' > /tmp/cell_inc/sys/synchronization.h
          #ifndef _SYS_SYNCHRONIZATION_H_
          #define _SYS_SYNCHRONIZATION_H_
          #include <stdint.h>
          typedef uint32_t sys_mutex_t;
          typedef struct { uint32_t attr_protocol; uint32_t attr_recursive; uint32_t attr_pshared; uint32_t attr_adaptive; uint64_t key; int32_t flags; uint32_t pad; char name[8]; } sys_mutex_attribute_t;
          typedef struct { uint64_t lock_var; uint32_t attribute; uint32_t recursive_count; uint32_t sleep_queue; uint32_t pad; } sys_lwmutex_t;
          typedef struct { uint32_t attr_protocol; uint32_t attr_recursive; char name; } sys_lwmutex_attribute_t;
          #define SYS_SYNC_PRIORITY 1
          #define SYS_SYNC_NOT_RECURSIVE 0x20
          #define SYS_SYNC_RECURSIVE 0x10
          #define sys_mutex_attribute_initialize(attr) do { (attr).attr_protocol = SYS_SYNC_PRIORITY; (attr).attr_recursive = SYS_SYNC_NOT_RECURSIVE; } while(0)
          #define sys_lwmutex_attribute_initialize(attr) do { (attr).attr_protocol = SYS_SYNC_PRIORITY; (attr).attr_recursive = SYS_SYNC_NOT_RECURSIVE; } while(0)
          int sys_mutex_create(sys_mutex_t *mutex, const sys_mutex_attribute_t *attr);
          int sys_mutex_destroy(sys_mutex_t *mutex);
          int sys_mutex_lock(sys_mutex_t mutex, uint64_t timeout);
          int sys_mutex_unlock(sys_mutex_t mutex);
          int sys_lwmutex_create(sys_lwmutex_t *lwmutex, const sys_lwmutex_attribute_t *attr);
          int sys_lwmutex_destroy(sys_lwmutex_t *lwmutex);
          int sys_lwmutex_lock(sys_lwmutex_t *lwmutex, uint64_t timeout);
          int sys_lwmutex_unlock(sys_lwmutex_t *lwmutex);
          #endif
          EOF

          cd src
          CFLAGS="-O2 -m32 -ffunction-sections -fdata-sections -nodefaultlibs -std=gnu99 -Wall -Wno-unused-function -I. -I/tmp/cell_inc -I$PS3DEV/ppu/include"
          LDFLAGS="-m32 -L$PS3DEV/ppu/lib -Wl,--gc-sections"
          powerpc64-ps3-elf-gcc $CFLAGS $LDFLAGS -o ds45pad_vsh.elf libc.c util.c hook.c config.c ds4.c dualsense.c gamehook.c usb.c passthru.c diag.c main.c -lusbd_stub -lio_stub -lfs_stub -lsysmodule_stub -lsysutil_stub || true
          ls -la

      - name: Enviar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: DS45Pad-SixaxisMod
          path: |
            src/*.elf
            src/*.sprx
          if-no-files-found: warn
