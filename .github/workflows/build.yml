name: Build DS45Pad PS3HEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Compilar DS45Pad
        run: |
          export CELL_SDK=/usr/local/ps3dev
          export PATH=$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin
          ls -la
          ls -la data/ || true
          ls -la release/ || true
          cd src && make all-builds || true
          ls -la src/

      - name: Enviar arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: DS45Pad-SixaxisMod
          path: |
            src/*.sprx
            src/*.elf
            release/*
          if-no-files-found: warn
